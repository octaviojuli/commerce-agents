# Add to compose.yaml; the legacy advisor stays available for rollback.
services:
  advisor-v4-api:
    image: ${ADVISOR_V4_API_IMAGE:?Specify a tested advisor API image}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ${WAREHOUSE_CONFIG_DIR}/advisor-v4.env
        format: raw
    volumes: ["${WAREHOUSE_DATA_DIR}/advisor-v4-materials:/materials"]
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=64m"]
    networks: [database, frontend, outbound]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  advisor-v4-web:
    image: ${ADVISOR_V4_WEB_IMAGE:?Specify a tested advisor web image}
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: {NODE_OPTIONS: --max-old-space-size=192}
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700,size=32m", "/app/tour/advisor-web/.next/cache:uid=1000,gid=1000,mode=0700,size=32m"]
    ports: ["127.0.0.1:${ADVISOR_V4_WEB_PORT:-18086}:3000"]
    networks: [frontend, gateway]
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
