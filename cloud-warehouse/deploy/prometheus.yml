global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/warehouse-rules.yml

scrape_configs:
  - job_name: tour-warehouse-api
    metrics_path: /metrics
    honor_timestamps: false
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/warehouse_metrics_token
    body_size_limit: 16MB
    sample_limit: 50000
    label_limit: 12
    label_name_length_limit: 64
    label_value_length_limit: 200
    static_configs:
      - targets: [api:8005]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: warehouse_http_.*
        action: keep
