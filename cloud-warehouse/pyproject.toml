[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-warehouse"
version = "0.1.0.dev0"
description = "Organization-scoped travel catalog, inventory and supplier integration services."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "route-kit==1.0.0",
  "merchant-agent-core==0.1.0.dev0",
  "shopping-agent-core==0.1.0.dev0",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg_pool>=3.3,<4",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "cryptography>=50,<51",
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.115",
  "anyio>=4,<5",
  "uvicorn>=0.30",
  "prometheus-client>=0.26,<0.27",
]

[project.scripts]
warehouse = "cloud_warehouse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cloud_warehouse"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "cloud_warehouse/migrations"
"templates" = "cloud_warehouse/templates"
