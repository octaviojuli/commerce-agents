[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-kit"
version = "1.0.0"
description = "Itinerary attachments (PDF, DOCX) to evidence-linked route content and a detail page"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "anthropic>=0.40"]

[project.optional-dependencies]
vision = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
route_kit = ["templates/*.html"]
