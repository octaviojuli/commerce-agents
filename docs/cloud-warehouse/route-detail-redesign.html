function issues(){const result=[];state.draft.itinerary.forEach((d,i)=>{if(!d.title.trim()||!d.summary.trim()||!d.blocks.length||d.blocks.some(b=>!b.text.trim()))result.push({day:i,field:'内容',text:`第 ${i+1} 天内容待补充`});if(d.hotelStatus!=='已确认')result.push({day:i,field:'住宿',text:`第 ${i+1} 天住宿待核实`});});return result;}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3800);}
function changed(){state.dirty=true;render();}
function save(){state.savedAt=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});state.dirty=false;try{localStorage.setItem(KEY,JSON.stringify(state));toast('示例草稿已保存在本浏览器，未写入云仓。');}catch{state.dirty=true;toast('浏览器不允许本地保存，本次编辑仍保留在页面内。');}render();}
function chip(t){return `<span class="chip ${t.visible?'':'internal'}"><button class="edit" data-action="edit-tag" data-id="${esc(t.id)}" aria-label="编辑标签 ${esc(t.label)}">${esc(t.label)}${t.visible?'':' · 内部'}</button><button class="remove" data-action="remove-tag" data-id="${esc(t.id)}" aria-label="移除标签 ${esc(t.label)}">×</button></span>`;}
function quality(){const errors=issues();return `<aside class="panel quality"><span class="eyebrow">发布前核对</span><div class="qualityscore">${5-new Set(errors.map(e=>e.day)).size}<small> / 5 天已完整</small></div><p class="small muted">草稿可以保存，完整内容才能发布。</p><div class="dots"><span style="width:${(5-new Set(errors.map(e=>e.day)).size)*20}%"></span></div><div class="qualityline"><span>标题与每日简述</span><span>${state.draft.itinerary.filter(d=>d.title&&d.summary).length} / 5</span></div><div class="qualityline"><span>三餐与住宿</span><span>${5-errors.filter(e=>e.field==='住宿').length} / 5</span></div><div class="qualityline"><span>费用与退改规则</span><span>已填示例</span></div><div class="qualityline"><span>客户公开标签</span><span>${state.draft.tags.filter(t=>t.visible).length} 项</span></div>${errors.length?errors.map(e=>`<button class="issue" data-action="issue" data-index="${e.day}"><strong>! ${esc(e.text)}</strong><small>定位并补充核对 →</small></button>`).join(''):'<p class="notice small" style="margin-top:16px">结构检查通过，仍需人工核对事实。</p>'}<div class="divider"></div><p class="small muted">客户当前看到：示例 V${state.version}。编辑不会立即改变已发布内容。</p><button class="quiet small" data-action="missing-demo" style="margin-top:8px">切换到缺项样例</button><div class="divider"></div><span class="tinylabel">版本记录</span><div class="history" style="margin-top:12px">${state.history.slice(-3).reverse().map(x=>`<div>${esc(x)}</div>`).join('')}</div></aside>`;}
function overview(){return `<div class="stack"><section class="panel"><div class="sectiontitle"><h2>线路概览</h2><button class="quiet" data-action="edit-intro">编辑简介</button></div><div class="hero"><div><span class="fieldlabel">产品简介</span><p>${esc(state.draft.intro)}</p><div class="topfacts row"><span>5 天 / 4 晚</span><span>${esc(state.draft.city)}出发</span></div><div class="divider"></div><span class="fieldlabel">对客副标题</span><p class="fieldvalue">${esc(state.draft.subtitle)}</p></div>${art()}</div><div class="highlights">${state.draft.highlights.map((h,i)=>`<div class="highlight"><span>0${i+1}</span><strong>${esc(h.title)}</strong><p>${esc(h.text)}</p></div>`).join('')}</div><p class="sourcefoot">产品简介和卖点单独维护；标签用于筛选，不再拼成宣传长文。</p></section><section class="panel"><div class="sectiontitle"><div><h2>线路标签</h2><p class="small muted">点击标签修改；× 移除。发布后才进入顾问查询。</p></div><button data-action="add-tag">＋ 新增标签</button></div>${['目的地','主题体验','服务安排','内部检索'].map(cat=>`<div class="taggroup"><label>${cat}</label><div class="chips">${state.draft.tags.filter(t=>t.category===cat).map(chip).join('')||'<span class="muted small">暂无标签</span>'}</div></div>`).join('')}<div class="candidate"><div class="sectiontitle" style="margin-bottom:8px"><strong class="small">来源候选 · 尚未确认</strong><button class="quiet small" data-action="candidate">核对并添加</button></div><span class="chip">花园游览</span><p class="small muted" style="margin-top:8px">原始标签保留备查；人工移除的标签不会被下一次同步自动加回。</p></div>${state.excluded.length?`<p class="small muted" style="margin-top:12px">本地已排除：${state.excluded.map(esc).join('、')}</p>`:''}</section><section class="panel"><div class="sectiontitle"><h3>顾问查询效果预览</h3><span class="badge">已发布 V${state.version}</span></div><label class="fieldlabel" for="tagSearch">输入已发布标签，例如“海岸”</label><input id="tagSearch" class="input" placeholder="搜索目的地、主题、体验…"><p id="searchResult" class="small muted" style="margin-top:12px">查询使用已发布标签，草稿和候选词不参与匹配。</p></section></div>`;}
function daily(){const d=state.draft.itinerary[dayIndex];return `<div class="editorlayout"><nav class="daymenu" aria-label="编辑日程">${state.draft.itinerary.map((x,i)=>`<button data-action="select-day" data-index="${i}" class="${i===dayIndex?'active':''}" aria-current="${i===dayIndex?'step':'false'}"><strong>D${i+1} ${x.hotelStatus!=='已确认'?'!':''}</strong>${esc(x.places[x.places.length-1])}<small>${x.hotelStatus==='已确认'?'内容已齐':'待核对'}</small></button>`).join('')}</nav><section class="panel"><div class="row between"><div class="daytitle"><span class="daynumber">0${d.number}</span><div><p class="eyebrow">DAY ${d.number}</p><h2>${esc(d.title)}</h2></div></div><button class="quiet" data-action="edit-day">编辑日程概览</button></div><div class="summarybox"><div class="row between"><span class="tinylabel">每日简述 · 同时用于简要行程</span><button class="quiet small" data-action="edit-day">编辑</button></div><p>${esc(d.summary)}</p></div><p class="small muted">交通：${esc(d.transport)}</p>${d.blocks.map((b,i)=>`<article class="contentblock"><div class="row"><span class="blocktype">${esc(b.type)}</span><h3>${esc(b.title)}</h3><span class="blocktools"><button class="quiet" data-action="edit-block" data-index="${i}">编辑</button><button class="quiet" data-action="evidence" data-index="${i}">对照原文</button></span></div><p>${esc(b.text)}</p><p class="small muted">${esc(b.detail)}</p></article>`).join('')}<div class="meals">${d.meals.map((v,i)=>`<div><p class="muted">${['早餐','午餐','晚餐'][i]}</p><strong>${esc(v)}</strong></div>`).join('')}</div><div class="hotel"><strong>当晚住宿</strong><div><p>${esc(d.hotel)}</p><span class="small ${d.hotelStatus==='已确认'?'muted':'stale'}">${d.hotelStatus==='已确认'?'供应商描述标准 · 以已复核约定为准':'待核实，暂不能发布'}</span></div><button class="quiet small" style="margin-left:auto" data-action="edit-hotel">编辑</button></div><p class="sourcefoot">来源：虚构示例文档 · 无真实附件。原文与人工整理内容分别保留。</p></section></div>`;}
function terms(){return `<section class="panel stack"><div class="sectiontitle"><h2>费用与出行规则</h2><button class="quiet" data-action="edit-terms">编辑规则</button></div><div class="termgrid"><section><h3>费用包含</h3><ul>${state.draft.inclusions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section><section><h3>费用不含</h3><ul>${state.draft.exclusions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section></div><div class="divider" style="margin:0"></div><h3>出行须知与退改</h3>${state.draft.notices.map(t=>`<p>${esc(t)}</p>`).join('')}<p class="notice small">购物、自费、限制与退改必须完整保留；不能因为精简文案而遗漏。</p></section>`;}
function prices(){const p=dates[dateIndex];return `<section class="panel stack"><div class="row between"><div><h2>团期价格与库存</h2><p class="muted small">线路内容独立维护，价格跟随具体团期。</p></div><button data-action="refresh-price" ${priceRefreshing?'disabled':''}>${priceRefreshing?'正在刷新…':'刷新最新价格'}</button></div><div class="switchdates">${dates.map((d,i)=>`<button class="${i===dateIndex?'active':''}" data-action="date" data-index="${i}">${d.label}<br><span class="muted small">${d.status}</span></button>`).join('')}</div><div class="pricebox"><div><span class="tinylabel">成人 · 统一同行结算价</span><p><strong>${amount(p.settlement)} <small>/ 人</small></strong></p></div><div><span class="badge">所有采购客户同价</span><p class="small muted">自动读取供应源标准价，不需要核验或选择客户。</p></div></div><div class="table-wrap"><table><thead><tr><th>计价项</th><th>市场参考价</th><th>统一同行结算价</th><th>状态</th></tr></thead><tbody><tr><td>成人</td><td>${amount(p.market)}</td><td><strong>${amount(p.settlement)}</strong></td><td><span class="badge">已取得</span></td></tr><tr><td>儿童</td><td>待确认</td><td>待确认</td><td class="stale">来源返回 0，需核对</td></tr><tr><td>老人</td><td>待确认</td><td>待确认</td><td class="stale">来源返回 0，需核对</td></tr><tr><td>单房差</td><td>¥600</td><td>¥600</td><td>每人</td></tr></tbody></table></div><div class="row between small muted"><span>来源：ACME B2B · ${p.code} · CNY</span><span id="priceTime">示例查询时间：10:32</span></div><div class="divider" style="margin:0"></div><div class="row between"><strong>商户库存：示例可售 18 位</strong><span class="badge">顾问 / 客户仅看“${p.status}”</span></div><p class="notice small">不同团期和人数类别可以不同价；同一团期、同一方案的所有采购客户使用相同结算价。对客页面仅显示经确认的市场参考售价。</p></section>`;}
function merchant(){return `<div class="titlebar row between"><div><p class="eyebrow">线路管理 / ACME-031</p><h1>${esc(state.draft.title)}</h1><div class="topfacts row"><span class="badge">产品已上架</span><span class="badge ${state.dirty?'warn':''}">${state.dirty?'有未保存编辑':'示例草稿'}</span><span>当前发布 V${state.version}</span><span>5 天 · 4 晚</span></div></div><div class="actions"><button data-action="draft-preview">预览当前草稿</button><button data-action="save">保存草稿</button><button class="primary" data-action="publish">模拟审核发布</button></div></div><nav class="tabs" aria-label="商户内容分区">${[['overview','概览与标签'],['daily','逐日内容'],['terms','费用规则'],['prices','团期价格']].map(([id,name])=>`<button class="${tab===id?'active':''}" data-tab="${id}" aria-pressed="${tab===id}">${name}</button>`).join('')}</nav><div class="workgrid"><div>${tab==='overview'?overview():tab==='daily'?daily():tab==='terms'?terms():prices()}</div>${quality()}</div><div class="footerstate"><span class="statusdot"></span><span>${state.savedAt?'示例保存于 '+esc(state.savedAt):'示例修改保留在当前页面；点击保存可留存在本浏览器。'}</span><button class="quiet small" data-action="loading-demo">查看加载过渡方案</button><button class="quiet small" data-action="reset">重置示例</button></div>`;}
function publicProjection(d){return {title:d.title,subtitle:d.subtitle,intro:d.intro,highlights:d.highlights,tags:d.tags.filter(t=>t.visible).map(t=>t.label),itinerary:d.itinerary.map(x=>({number:x.number,title:x.title,summary:x.summary,transport:x.transport,blocks:x.blocks.map(b=>({title:b.title,text:b.text,detail:b.detail})),meals:x.meals,hotel:x.hotel})),inclusions:d.inclusions,exclusions:d.exclusions,notices:d.notices};}
function customer(){const d=publicProjection(previewDraft?state.draft:state.published),p=dates[dateIndex];return `<div class="devicebar"><div><h2>客户浏览效果</h2><p class="muted small">${previewDraft?'商户内部预览当前草稿；未对外发布。':'只展示已发布的内容，不随编辑草稿即时改变。'}</p></div><div class="row"><button data-action="published-preview">看已发布版本 V${state.version}</button><button class="${!mobile?'active':''}" data-action="desktop">桌面</button><button class="${mobile?'active':''}" data-action="mobile">手机</button></div></div><div class="customerstage ${mobile?'mobile':''}">${previewDraft?'<div class="publishtip">商户内部草稿预览 · 客户不会看到此版本 · 资料仍须复核</div>':''}<div class="customerbody"><div class="customerbar"><span class="brand">ACME JOURNEYS</span><span class="small muted">安心出发 · 从容旅行</span></div><section class="customerhero"><div><p class="eyebrow">5 DAYS / COAST & TOWN</p><h1>${esc(d.title)}</h1><p class="intro">${esc(d.subtitle)}</p><div class="chips" style="margin-top:20px">${d.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div></div>${art()}</section><div class="customerinner"><nav class="customernav" aria-label="客户内容导航"><a href="#customer-overview">行程亮点</a><a href="#customer-itinerary">每日行程</a><a href="#customer-costs">费用说明</a><a href="#customer-notices">出行须知</a></nav><div class="customergrid"><div><section id="customer-overview"><h2>把五天，留给美好</h2><p class="muted" style="margin-top:12px">${esc(d.intro)}</p><div class="highlights">${d.highlights.map((h,i)=>`<div class="highlight"><span>0${i+1}</span><strong>${esc(h.title)}</strong><p>${esc(h.text)}</p></div>`).join('')}</div></section><section id="customer-itinerary" style="margin-top:38px"><div class="row between"><h2>每日行程</h2><span class="muted small">5 天 / 4 晚</span></div><div class="journeymap">${d.itinerary.map(x=>`<div><span>${x.number}</span>${esc(x.title.split(' → ').pop())}</div>`).join('')}</div>${d.itinerary.map((x,i)=>`<details class="customerday" ${i===1?'open':''}><summary><span class="num">0${x.number}</span><div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p></div></summary><div style="padding-top:15px"><p class="small muted">交通：${esc(x.transport)}</p>${x.blocks.map(b=>`<section class="contentblock"><h3>${esc(b.title)}</h3><p>${esc(b.text)}</p><p class="small muted">${esc(b.detail)}</p></section>`).join('')}<div class="meals">${x.meals.map((m,j)=>`<div><p class="muted">${['早餐','午餐','晚餐'][j]}</p><strong>${esc(m)}</strong></div>`).join('')}</div><div class="hotel"><strong>当晚住宿</strong><p>${esc(x.hotel)}</p></div></div></details>`).join('')}</section><section id="customer-costs" class="customercosts"><h2>费用说明</h2><h3 style="margin-top:17px">费用包含</h3><ul>${d.inclusions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>费用不含</h3><ul>${d.exclusions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section id="customer-notices"><h2>出行须知</h2>${d.notices.map(x=>`<p class="small" style="margin-top:12px">${esc(x)}</p>`).join('')}</section></div><aside class="customeraside"><div class="panel stack"><div><span class="tinylabel">成人参考售价</span><p class="customerprice">${amount(p.market)} <small>/ 人起</small></p><p class="small muted">所选示例团期 · 最终价格由顾问确认</p></div><label><span class="fieldlabel">选择出发日期</span><select class="input" id="customerDate">${dates.map((x,i)=>`<option value="${i}" ${i===dateIndex?'selected':''}>${x.label} · ${x.status}</option>`).join('')}</select></label><div class="row between"><span class="small">当前库存状态</span><span class="badge">${p.status}</span></div><button class="primary" data-action="inquire">向顾问咨询此行程</button><p class="small muted">可确认出发安排、儿童报价与房间需求。</p></div></aside></div><p class="footnote">ACME 虚构行程，仅供设计评审。实际出行安排以最终确认的行程说明为准。</p></div><div class="customercta"><div><strong>${amount(p.market)}</strong><span class="small"> / 人起</span><span class="muted small">　${p.label} · ${p.status}</span></div><button class="primary" data-action="inquire">咨询行程</button></div></div></div>`;}
function schema(){return `<div class="titlebar"><p class="eyebrow">CONTENT BEFORE PRESENTATION</p><h1>先把内容整理好，再让页面讲清楚</h1><p class="muted">一份标准内容，多种阅读方式；整理与审核在打开页面之前完成。</p></div><div class="stepflow"><div><span>01</span><strong>原始证据</strong><p>API、原始附件和真实页块位置完整保留。</p></div><div><span>02</span><strong>抽取候选</strong><p>分日、交通、三餐、住宿和条款各归其位，缺项明确标记。</p></div><div><span>03</span><strong>编辑与审核</strong><p>逐项整理，原文对照，重要信息不删减，事实不补造。</p></div><div><span>04</span><strong>发布与展示</strong><p>发布版本统一供两端使用，客户只收到允许公开的字段。</p></div></div><div class="panel" style="margin-top:25px"><h2>需要维护的字段</h2><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>内容</th><th>商户维护</th><th>客户看到</th><th>保存方式</th></tr></thead><tbody>${[['线路基础','编号、标题、天数、城市','标题、天数、路线','现有产品字段'],['检索标签','分类、名称、来源、公开范围','已确认的公开标签','发布内容 + 筛选索引'],['线路卖点','短标题、说明、证据','简短卖点卡片','独立 highlights[]'],['每日简述','当天路线 + 1–2 句概括','简要行程与每日摘要','days[].summary'],['每日内容','交通 / 游览 / 自由活动 / 提醒','有顺序的内容块','days[].blocks[]'],['三餐住宿','逐餐是否包含、住宿方式与标准','每天清楚可见','days[].meals / accommodation'],['费用规则','包含、不含、购物、自费、退改','完整且易找到的条件','结构化条目'],['统一结算价','按团期统一读取、刷新时间','不向直客展示','独立团期价格'],['原文与质量','候选、差异、缺项、版本','不展示内部审核信息','保留现有解析与发布记录']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="termgrid" style="margin-top:24px"><section class="panel"><h2>当前已有什么</h2><p style="margin-top:12px">已有逐日结构、数据库解析稿、人工复核发布和私有附件。当前需要升级内容整理与编辑体验。</p><p class="notice warn small" style="margin-top:17px">13 天只解析出 2 天，属于抽取质量问题。换样式不能补齐事实，也不能直接发布给客户。</p></section><section class="panel"><h2>本轮价格口径</h2><p style="margin-top:12px">同一团期、同一方案的所有采购客户使用统一结算价。价格读取所需技术参数放在供应源配置中，不出现在业务页面。</p><p class="notice small" style="margin-top:17px">正式验收样本：阳光西葡统一结算价 12,700 元，用户已确认。这里的 ACME 页面金额为虚构示例。</p></section></div><p class="footnote">详细字段、迁移、内容发布与性能方案见 <a href="route-detail-redesign.md">设计说明</a>。参考 <a href="https://docs.wagtail.org/en/stable/topics/streamfield.html" target="_blank" rel="noreferrer">Wagtail 的结构化内容块</a>；沿用现有云仓，不更换整个系统。</p>`;}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode);});$('#app').innerHTML=mode==='merchant'?merchant():mode==='customer'?customer():schema();}
function modal(title,body,submit,handler){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalSubmit').textContent=submit;$('#modalSubmit').hidden=!submit;modalHandler=handler;$('#modal').showModal();}
function field(label,name,value,textarea=false){return `<label><span class="fieldlabel">${label}</span>${textarea?`<textarea class="input" name="${name}" required>${esc(value)}</textarea>`:`<input class="input" name="${name}" value="${esc(value)}" maxlength="70" required>`}</label>`;}
function editTag(t){modal(t?'编辑标签':'新增标签',field('标签名称','label',t?.label||'')+`<div class="formgrid"><label><span class="fieldlabel">标签分类</span><select class="input" name="category">${['目的地','主题体验','服务安排','内部检索'].map(c=>`<option ${t?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="check"><input type="checkbox" name="visible" ${!t||t.visible?'checked':''}>客户可见（发布后生效）</label></div><p class="notice small">来源原词保留备查。人工标签不改变上游系统；与产品承诺相关的内容需先核实。</p>`,'保存到草稿',f=>{const label=f.get('label').trim();if(!label)return false;if(state.draft.tags.some(x=>x.label===label&&x.id!==t?.id)){toast('已有同名标签，请修改名称。');return false;}const v={id:t?.id||'tag-'+Date.now(),label,category:f.get('category'),visible:f.has('visible')};if(t)state.draft.tags=state.draft.tags.map(x=>x.id===t.id?v:x);else state.draft.tags.push(v);changed();});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;previewDraft=false;render();window.scrollTo(0,0);return;}if(b.dataset.tab){tab=b.dataset.tab;render();return;}const a=b.dataset.action,i=Number(b.dataset.index),d=state.draft.itinerary[dayIndex];if(!a)return;
 if(a==='close-modal'){$('#modal').close();return;}
 if(a==='save'){save();return;}
 if(a==='add-tag'){editTag(null);return;}
 if(a==='edit-tag'){editTag(state.draft.tags.find(t=>t.id===b.dataset.id));return;}
 if(a==='remove-tag'){const t=state.draft.tags.find(t=>t.id===b.dataset.id);state.excluded.push(t.label);state.draft.tags=state.draft.tags.filter(x=>x.id!==t.id);changed();toast('标签已从草稿移除；发布后生效。');return;}
 if(a==='candidate'){if(state.draft.tags.some(t=>t.label==='花园游览')){toast('此候选已添加。');return;}modal('核对来源候选','<p>候选标签：<strong>花园游览</strong></p><p>对应示例：第 2 天“海湾花园”和第 4 天“城郊花园”。核对后添加为确认标签。</p><p class="notice small">实际系统显示原始 API 字段或附件证据；不将原始候选直接对客展示。</p>','确认并加入草稿',()=>{state.draft.tags.push({id:'candidate-garden',label:'花园游览',category:'主题体验',visible:true});changed();});return;}
 if(a==='edit-intro'){modal('编辑产品简介',field('对客副标题','subtitle',state.draft.subtitle)+field('产品简介','intro',state.draft.intro,true),'保存到草稿',f=>{state.draft.subtitle=f.get('subtitle').trim();state.draft.intro=f.get('intro').trim();changed();});return;}
 if(a==='select-day'||a==='issue'){dayIndex=i;tab='daily';mode='merchant';render();return;}
 if(a==='edit-day'){modal(`编辑第 ${d.number} 天概览`,field('当天标题 / 路线','title',d.title)+field('每日简述','summary',d.summary,true)+field('交通说明','transport',d.transport,true)+'<p class="small muted">简述同时用于路线速览和逐日标题下方，无需重复维护。</p>','保存到草稿',f=>{d.title=f.get('title').trim();d.summary=f.get('summary').trim();d.transport=f.get('transport').trim();changed();});return;}
 if(a==='edit-block'){const block=d.blocks[i];modal(`编辑内容块 · ${block.type}`,field('标题','title',block.title)+field('展示段落','text',block.text,true)+field('游览 / 费用说明','detail',block.detail)+'<p class="notice small">整理表达不能扩大原文承诺，门票、自由活动与限制条件要保留。</p>','保存到草稿',f=>{block.title=f.get('title').trim();block.text=f.get('text').trim();block.detail=f.get('detail').trim();changed();});return;}
 if(a==='edit-hotel'){modal('核对当晚住宿',field('住宿安排','hotel',d.hotel)+`<label class="check"><input type="checkbox" name="confirmed" ${d.hotelStatus==='已确认'?'checked':''}>已对照来源核实此安排（示例）</label><p class="small muted">没有酒店住宿时明确选择夜航、船宿、返家等方式；不能把缺失当作“无住宿”。</p>`,'保存到草稿',f=>{d.hotel=f.get('hotel').trim();d.hotelStatus=f.has('confirmed')?'已确认':'待核实';changed();});return;}
 if(a==='evidence'){const original=base.itinerary[dayIndex].blocks[i],edited=d.blocks[i];modal('原文与展示内容对照',`<span class="badge">第 ${d.number} 天 · 虚构示例来源</span><div><span class="fieldlabel">保留的来源原文</span><div class="sourcecompare">${esc(original.text)}</div></div><div><span class="fieldlabel">当前编辑草稿</span><div class="sourcecompare">${esc(edited.text)}</div></div><p class="small muted">真实系统只展示已记录的物理页块；没有证据时不编造页码。人工修改单独留痕。</p>`,null,null);return;}
 if(a==='edit-terms'){modal('编辑费用与规则',field('费用包含 · 每行一项','included',state.draft.inclusions.join('\n'),true)+field('费用不含 · 每行一项','excluded',state.draft.exclusions.join('\n'),true)+field('须知与退改 · 每行一项','notices',state.draft.notices.join('\n'),true),'保存到草稿',f=>{for(const [k,n]of [['inclusions','included'],['exclusions','excluded'],['notices','notices']])state.draft[k]=f.get(n).split('\n').map(x=>x.trim()).filter(Boolean);changed();});return;}
 if(a==='publish'){const found=issues();if(found.length){modal('暂不能发布',`<p class="notice warn">还有 ${found.length} 项关键内容需要核对。已发布版本不会受到影响。</p>${found.map(x=>`<p>${esc(x.text)}</p>`).join('')}`,'去处理第一项',()=>{mode='merchant';tab='daily';dayIndex=found[0].day;render();});return;}modal('模拟审核发布','<p>结构检查已通过。请核对内容与来源，确认标签公开范围及费用条款。</p><p class="notice small">此按钮仅模拟审批结果，更新本草稿的客户预览，不写入云仓或向外发送。</p>','确认模拟发布',()=>{state.published=clone(state.draft);state.version+=1;state.history.push(`示例版本 V${state.version} · 审核发布模拟`);save();toast(`模拟发布完成，客户预览已更新为 V${state.version}。`);});return;}
 if(a==='missing-demo'){state.draft.itinerary[2].hotel='住宿资料待核对';state.draft.itinerary[2].hotelStatus='待核实';dayIndex=2;tab='daily';changed();toast('已切换缺项样例：第 3 天住宿待核实。');return;}
 if(a==='draft-preview'){mode='customer';previewDraft=true;render();window.scrollTo(0,0);return;}
 if(a==='published-preview'){previewDraft=false;render();return;}
 if(a==='mobile'||a==='desktop'){mobile=a==='mobile';render();return;}
 if(a==='date'){dateIndex=i;render();return;}
 if(a==='refresh-price'){priceRefreshing=true;render();setTimeout(()=>{priceRefreshing=false;render();$('#priceTime').textContent='示例刷新完成：'+new Date().toLocaleTimeString('zh-CN');toast('价格刷新交互演示完成，未调用真实接口。');},700);return;}
 if(a==='inquire'){modal('向顾问咨询此行程',`<div class="notice">${esc((previewDraft?state.draft:state.published).title)}<br>${dates[dateIndex].label} · 成人参考 ${amount(dates[dateIndex].market)} / 人</div><div class="formgrid"><label><span class="fieldlabel">成人数</span><input class="input" name="adults" type="number" min="1" max="30" value="2" required></label><label><span class="fieldlabel">儿童数</span><input class="input" name="children" type="number" min="0" max="30" value="0" required></label></div><label><span class="fieldlabel">想了解的问题</span><textarea class="input" name="note" placeholder="例如：儿童报价、房间安排、集合地点"></textarea></label><p class="small muted">此处仅演示咨询表单，不收集真实联系方式、不发送信息，也不占位或下单。</p>`,'预览咨询内容',f=>{modalHandler=null;const summary=`咨询预览：${f.get('adults')} 位成人、${f.get('children')} 位儿童，${dates[dateIndex].label}出发。未发送任何消息。`;setTimeout(()=>modal('咨询预览',`<p>${esc(summary)}</p><p>${esc(f.get('note'))}</p>`,null,null),0);});return;}
 if(a==='loading-demo'){modal('详情加载过渡',`<p class="eyebrow">ACME-031 · 列表已有资料立即显示</p><h3>${esc(state.draft.title)}</h3><div class="loadingmock"><div class="skeleton big"></div><div class="skeleton" style="width:60%"></div><div class="skeleton lines"></div></div><p class="small muted">正文读取期间保持布局稳定。权限校验失败则清除受保护内容，不保留旧数据冒充成功。</p>`,null,null);return;}
 if(a==='reset'){modal('重置交互示例','<p>仅清除本浏览器保存的草稿演示，恢复初始 ACME 内容。不会影响业务数据。</p>','重置示例',()=>{localStorage.removeItem(KEY);state={draft:clone(base),published:clone(base),version:3,dirty:false,savedAt:'',history:['示例版本 V3 · 已审核发布'],excluded:[]};dayIndex=1;render();});return;}
});
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();if(!modalHandler)return;const handler=modalHandler,result=handler(new FormData(e.target));if(result!==false)$('#modal').close();});
document.addEventListener('input',e=>{if(e.target.id==='tagSearch'){const q=e.target.value.trim();const matches=state.published.tags.filter(t=>t.label.includes(q));$('#searchResult').textContent=q?(matches.length?`匹配到此线路：${matches.map(t=>t.label).join('、')}（已发布 V${state.version}）`:'当前已发布标签无匹配；新编辑请先审核发布。'):'查询使用已发布标签，草稿和候选词不参与匹配。';}});
document.addEventListener('change',e=>{if(e.target.id==='customerDate'){dateIndex=Number(e.target.value);render();}});
render();
</script></body></html>
